name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    # 跳过 bot 自己的 push: docs/ 已是最新, 避免每次 main push 触发两次构建
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '20'

      - name: Build to docs/ (via build.js)
        run: |
          node scripts/build.js
          rm -rf docs
          mkdir -p docs
          # 用 dist/. 而不是 dist/*: 通配不匹配点号文件, 会漏掉 build.js 写入的 .nojekyll,
          # 导致 Pages 仍走 Jekyll 处理, 下划线开头的资源被吞掉。
          cp -r dist/. docs/
          ls -la docs/

      - name: Commit and push docs/
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/ -f
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "deploy: update docs/ from src/"
          git push
