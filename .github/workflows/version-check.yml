name: Version Check

# 版本一致性"check 流程"
#   1) PR -> main: 检测 PR 提交里的版本号是否一致。
#      为避免 pwn-request(M-1), 这里 **不执行 PR 提交中的任何仓库脚本**:
#      checkout 关闭凭据持久化, 版本比较用内联 jq/sed 完成, 只读数据不执行代码。
#   2) 推送 v* tag: 校验三处一致, 且 tag 版本号必须等于文件当前版本,
#      否则直接失败 (不允许静默上传错误/重复版本到 App Store)。
#      tag 来自受信任分支, 因此允许调用仓库自带脚本 check-versions.js。
on:
  pull_request:
    branches: [main]
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # PR 模式检出 PR 自己的提交(否则检查的是 base, 等于没检查);
          # persist-credentials: false 保证 .git/config 里没有 token, 即使被诱导也无法 push。
          ref: ${{ github.event.pull_request.head.sha || github.ref }}
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '20'

      # ---- PR 模式: 内联比较, 不执行仓库代码 ----
      - name: Check version consistency (PR files, no repo code executed)
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          set -eu
          pkg=$(jq -r '.version' package.json)
          conf=$(jq -r '.version' src-tauri/tauri.conf.json)
          cargo_ver=$(awk -F'"' '/^[[:space:]]*version[[:space:]]*=/{print $2; exit}' src-tauri/Cargo.toml)
          sw_ver=$(sed -n "s/.*advanced-json-formatter-v\([0-9.]*\)'.*/\1/p" sw.js)

          echo "package.json=$pkg tauri.conf.json=$conf Cargo.toml=$cargo_ver sw.js=$sw_ver"

          if [ -z "$pkg" ] || [ -z "$conf" ] || [ -z "$cargo_ver" ] || [ -z "$sw_ver" ]; then
            echo "::error::无法从上述文件中解析版本号, 检查解析逻辑"
            exit 1
          fi

          if [ "$pkg" != "$conf" ] || [ "$pkg" != "$cargo_ver" ] || [ "$pkg" != "$sw_ver" ]; then
            echo "::error::版本不一致! 请以 package.json=$pkg 为准统一 (node scripts/check-versions.js fix)"
            exit 1
          fi

          echo "✅ 版本一致: $pkg"

      # ---- Tag 模式: tag 版本号必须等于文件当前版本 ----
      # (不一致直接失败, 不自动改写发版文件; 提示先 bump 再打 tag)
      # tag 指向受信任分支, 这里才允许调用仓库自带脚本。
      - name: Check version consistency (trusted tag code)
        if: ${{ github.event_name != 'pull_request' }}
        run: node scripts/check-versions.js check

      - name: Tag version must match files (tag only)
        if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') }}
        run: node scripts/check-versions.js tag "${GITHUB_REF_NAME#v}"
