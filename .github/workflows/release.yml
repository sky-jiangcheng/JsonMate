name: Release Build

on:
  push:
    tags:
      - 'v*'
    branches:
      - appstore
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ============================================================
  # 版本门禁: 所有构建/上架作业都依赖它
  #   - 五处版本号 (version.json / package.json / tauri.conf.json / Cargo.toml / sw.js) 必须一致
  #   - 打 v* tag 时, tag 版本号必须等于所有文件的当前版本
  #     否则会静默上传错误/重复的版本到 App Store
  #   - 上架作业用的版本号从这里的 outputs.version 取 (来源 version.json),
  #     不再用 github.ref_name (push appstore 分支时它是字面量 "appstore")
  # ============================================================
  version-gate:
    outputs:
      # 上架/去重检查用的版本号统一从这里取 version.json(单一版本源)。
      # 不能用 github.ref_name: push 到 appstore 分支时它是字面量 "appstore",
      # 当作版本传给检查脚本会查错对象, submit 脚本还会白等几十分钟才失败。
      version: ${{ steps.resolve-version.outputs.version }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '20'

      - name: Verify version consistency (5 files)
        run: node scripts/check-versions.js check

      - name: Resolve release version from version.json
        id: resolve-version
        run: |
          VER=$(node -p "require('./version.json').version")
          if ! printf '%s' "$VER" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::version.json 里的版本号非法: '$VER'"
            exit 1
          fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "本次发布版本: $VER"

      - name: Verify tag version matches files
        if: startsWith(github.ref, 'refs/tags/')
        run: node scripts/check-versions.js tag "${GITHUB_REF_NAME#v}"

  linux:
    needs: [version-gate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libglib2.0-dev

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '20'

      - run: npm ci

      - name: Build dist/
        run: node scripts/build.js

      - name: Check for CDN references
        run: npm run check:cdn

      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "${{ github.ref_name }}"
          releaseBody: "见 CHANGELOG"
          releaseDraft: false
          prerelease: false
          args: --bundles deb,rpm,appimage

  macos:
    needs: [version-gate]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install Rust targets
        run: rustup target add x86_64-apple-darwin aarch64-apple-darwin

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '20'

      - run: npm ci

      - name: Build dist/
        run: node scripts/build.js

      - name: Check for CDN references
        run: npm run check:cdn

      - name: Generate macOS icons
        run: npx tauri icon src-tauri/app-icon-source.png

      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "${{ github.ref_name }}"
          releaseDraft: false
          prerelease: false
          args: --target universal-apple-darwin --bundles dmg,app

  windows:
    needs: [version-gate]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '20'

      - run: npm ci

      - name: Build dist/
        run: node scripts/build.js

      - name: Check for CDN references
        run: npm run check:cdn

      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "${{ github.ref_name }}"
          releaseDraft: false
          prerelease: false
          args: --bundles nsis

  macos-appstore:
    if: github.ref_name == 'appstore' || startsWith(github.ref, 'refs/tags/')
    needs: [version-gate]
    runs-on: macos-latest
    environment:
      name: appstore
    # job 级只保留"是否已配置"的布尔标记：secrets 上下文在 step 级 if 中不可用，
    # 而证书/密钥本体一律下沉到真正使用它们的 step，避免 npm ci / build.js
    # 这类依赖执行面读到签名私钥。
    env:
      HAS_APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE != '' }}
      HAS_PROVISIONING_PROFILE: ${{ secrets.PROVISIONING_PROFILE != '' }}
      HAS_APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY != '' }}
      HAS_APPLE_INSTALLER_CERTIFICATE: ${{ secrets.APPLE_INSTALLER_CERTIFICATE != '' }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      # ---- App Store 版本重复快速拦截 (在耗时构建之前失败) ----
      - name: Write App Store Connect API key
        if: env.HAS_APP_STORE_CONNECT_API_KEY == 'true'
        env:
          APP_STORE_CONNECT_ISSUER: ${{ secrets.APP_STORE_CONNECT_ISSUER }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          APP_STORE_CONNECT_APP_ID: ${{ secrets.APP_STORE_CONNECT_APP_ID_MAC }}
        run: |
          mkdir -p ~/private_keys
          echo "$APP_STORE_CONNECT_API_KEY" | base64 --decode > ~/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8
          echo "APP_STORE_CONNECT_KEY_PATH=$HOME/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8" >> $GITHUB_ENV

      - name: Fail fast if macOS App Store version already exists
        if: env.HAS_APP_STORE_CONNECT_API_KEY == 'true'
        env:
          APP_STORE_CONNECT_ISSUER: ${{ secrets.APP_STORE_CONNECT_ISSUER }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          APP_STORE_CONNECT_APP_ID: ${{ secrets.APP_STORE_CONNECT_APP_ID_MAC }}
          APP_VERSION: ${{ needs.version-gate.outputs.version }}
        run: python3 scripts/check-appstore-version.py MAC_OS "$APP_VERSION"

      - name: Install Rust targets
        run: rustup target add x86_64-apple-darwin aarch64-apple-darwin

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '20'

      - run: npm ci

      - name: Build dist/
        run: node scripts/build.js

      - name: Check for CDN references
        run: npm run check:cdn

      - name: Generate macOS icons
        run: npx tauri icon src-tauri/app-icon-source.png

      - name: Import Apple certificate
        if: env.HAS_APPLE_CERTIFICATE == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_KEYCHAIN_PASSWORD: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
        run: |
          echo "$APPLE_CERTIFICATE" | base64 --decode > certificate.p12
          # 创建构建用 keychain（只用这一个，避免 login.keychain 干扰）
          security create-keychain -p "$APPLE_KEYCHAIN_PASSWORD" build.keychain
          # 关键：不设 timeout，永不自动锁定（避免 productbuild 运行中 keychain 锁定卡死）
          security set-keychain-settings build.keychain
          security unlock-keychain -p "$APPLE_KEYCHAIN_PASSWORD" build.keychain
          # 导入证书到 build.keychain（同时授权 codesign 和 productbuild 访问）
          security import certificate.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productbuild -T /usr/bin/security
          # 设置 partition list，让 Apple 工具能无密码访问私钥（关键，不吞错误）
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$APPLE_KEYCHAIN_PASSWORD" build.keychain
          # 设置 keychain 搜索路径（只放 build.keychain）
          security list-keychains -d user -s build.keychain
          security default-keychain -s build.keychain
          # 验证并自动检测签名身份
          echo "=== Build keychain identities ==="
          security find-identity -v -p codesigning build.keychain
          SIGNING_ID=$(security find-identity -v -p codesigning build.keychain | grep -o '"[^"]*"' | head -1 | tr -d '"')
          echo "Detected signing identity: $SIGNING_ID"
          echo "APPLE_SIGNING_IDENTITY=$SIGNING_ID" >> $GITHUB_ENV
          # 输出证书完整信息（类型、颁发者、有效期）
          echo "=== Certificate full details ==="
          CERT_PEM=$(security find-certificate -a -p build.keychain)
          if [ -n "$CERT_PEM" ]; then
            echo "$CERT_PEM" | openssl x509 -noout -text 2>/dev/null | head -30
          else
            echo "(no cert found in build.keychain)"
          fi

      - name: Install provisioning profile
        if: env.HAS_PROVISIONING_PROFILE == 'true'
        env:
          PROVISIONING_PROFILE: ${{ secrets.PROVISIONING_PROFILE }}
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$PROVISIONING_PROFILE" | base64 --decode > ~/Library/MobileDevice/Provisioning\ Profiles/appstore.provisionprofile
          echo "$PROVISIONING_PROFILE" | base64 --decode > src-tauri/embedded.provisionprofile

      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "${{ github.ref_name }} (App Store)"
          releaseDraft: false
          prerelease: false
          args: --target universal-apple-darwin --config src-tauri/tauri.appstore.conf.json

      - name: Import Apple Installer certificate
        if: env.HAS_APPLE_INSTALLER_CERTIFICATE == 'true'
        env:
          APPLE_INSTALLER_CERTIFICATE: ${{ secrets.APPLE_INSTALLER_CERTIFICATE }}
          APPLE_INSTALLER_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_INSTALLER_CERTIFICATE_PASSWORD }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_KEYCHAIN_PASSWORD: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
        run: |
          # 优先用 installer 专用密码，否则回退到通用密码
          INSTALLER_PWD="${APPLE_INSTALLER_CERTIFICATE_PASSWORD:-$APPLE_CERTIFICATE_PASSWORD}"
          echo "$APPLE_INSTALLER_CERTIFICATE" | base64 --decode > installer-cert.p12
          # 解锁 build.keychain
          security unlock-keychain -p "$APPLE_KEYCHAIN_PASSWORD" build.keychain
          # 导入 Installer 证书到 build.keychain（不吞错误，确保导入成功）
          security import installer-cert.p12 -k build.keychain -P "$INSTALLER_PWD" -T /usr/bin/productbuild -T /usr/bin/security
          # 关键：重新设置 partition list，让 productbuild 能无密码访问 Installer 私钥（不吞错误）
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$APPLE_KEYCHAIN_PASSWORD" build.keychain

          # 列出 build.keychain 里的所有身份
          echo "=== All valid identities in build.keychain ==="
          security find-identity -v build.keychain

          # 从 find-identity 输出里抓 Installer 身份
          # 格式: 1) SHA "3rd Party Mac Developer Installer: Name (TEAM)"
          INSTALLER_ID=$(security find-identity -v build.keychain | grep -i "Installer" | grep -o '"[^"]*"' | head -1 | tr -d '"')
          if [ -z "$INSTALLER_ID" ]; then
            # 兜底：列出所有证书 CN，找 Installer 关键字
            INSTALLER_ID=$(security find-certificate -a -p build.keychain | openssl x509 -noout -subject 2>/dev/null | grep -i installer | sed -n 's/.*CN = //p' | tr -d '"' | head -1)
          fi
          echo "Detected installer identity: [$INSTALLER_ID]"
          if [ -z "$INSTALLER_ID" ]; then
            echo "ERROR: No installer identity found. Available identities:"
            security find-identity -v
            exit 1
          fi
          echo "APPLE_INSTALLER_IDENTITY=$INSTALLER_ID" >> $GITHUB_ENV

      - name: Build and sign PKG
        if: env.HAS_APPLE_INSTALLER_CERTIFICATE == 'true'
        env:
          APPLE_KEYCHAIN_PASSWORD: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
        run: |
          # 解锁 build.keychain
          security unlock-keychain -p "$APPLE_KEYCHAIN_PASSWORD" build.keychain
          # 诊断：确认 keychain 里有 Installer 身份
          echo "=== Identities before productbuild ==="
          security find-identity -v build.keychain

          # 找到 .app bundle（tauri 输出在 target/universal-apple-darwin/release/bundle/macos/）
          APP=$(find src-tauri/target -name "*.app" -type d -path "*universal-apple-darwin*" | head -1)
          if [ -z "$APP" ]; then
            echo "ERROR: No .app bundle found"
            exit 1
          fi
          echo "App bundle: $APP"
          echo "Installer identity: $APPLE_INSTALLER_IDENTITY"

          # 用 ASCII 文件名避免 productbuild 中文路径问题
          PKG_DIR="src-tauri/target/universal-apple-darwin/release/bundle/pkg"
          mkdir -p "$PKG_DIR"
          PKG="$PKG_DIR/JSON-Formatter.pkg"

          # productbuild 签名 + 300s 超时看门狗，防止 keychain ACL 弹窗导致无限卡死
          export PRODUCTBUILD_IDENTITY_CHECK=1
          (
            productbuild \
              --component "$APP" /Applications \
              --sign "$APPLE_INSTALLER_IDENTITY" \
              "$PKG" < /dev/null
          ) &
          PB_PID=$!
          (
            sleep 300
            if kill -0 $PB_PID 2>/dev/null; then
              echo "::error::productbuild timed out after 300s (likely keychain ACL prompt). Killing."
              kill -TERM $PB_PID 2>/dev/null
              sleep 2
              kill -KILL $PB_PID 2>/dev/null
            fi
          ) &
          WD_PID=$!
          wait $PB_PID
          PB_EXIT=$?
          kill $WD_PID 2>/dev/null || true
          if [ $PB_EXIT -ne 0 ]; then
            echo "::error::productbuild exited with $PB_EXIT"
            exit $PB_EXIT
          fi

          echo "=== Generated PKG ==="
          ls -lh "$PKG"
          echo "PKG_PATH=$PKG" >> $GITHUB_ENV

      - name: Upload PKG to App Store Connect
        if: env.HAS_APP_STORE_CONNECT_API_KEY == 'true' && env.HAS_APPLE_INSTALLER_CERTIFICATE == 'true'
        env:
          APP_STORE_CONNECT_ISSUER: ${{ secrets.APP_STORE_CONNECT_ISSUER }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
        run: |
          # 写入 API Key
          mkdir -p ~/private_keys
          echo "$APP_STORE_CONNECT_API_KEY" | base64 --decode > ~/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8

          PKG="${PKG_PATH}"
          if [ -z "$PKG" ] || [ ! -f "$PKG" ]; then
            PKG=$(find src-tauri/target -name "*.pkg" -type f -path "*universal-apple-darwin*" | head -1)
          fi
          if [ -z "$PKG" ]; then
            echo "ERROR: No PKG found"
            exit 1
          fi
          echo "Uploading PKG: $PKG"

          xcrun altool --upload-app \
            -f "$PKG" \
            --type mac \
            --apiKey "$APP_STORE_CONNECT_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER" \
            --verbose

          echo "✓ PKG uploaded to App Store Connect"

      - name: Install cryptography (pinned)
        if: env.HAS_APP_STORE_CONNECT_API_KEY == 'true' && env.HAS_APPLE_INSTALLER_CERTIFICATE == 'true'
        run: |
          # venv 而非系统 pip: 新版 runner 的 Python 可能带 EXTERNALLY-MANAGED 标记(PEP 668),
          # 直接 pip install 会失败。venv 同时避免污染 runner 自带环境。
          python3 -m venv "$RUNNER_TEMP/appstore-venv"
          echo "$RUNNER_TEMP/appstore-venv/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/appstore-venv/bin/python" -m pip install --upgrade pip -q
          "$RUNNER_TEMP/appstore-venv/bin/python" -m pip install "cryptography==50.0.1" -q

      - name: Submit for review
        if: env.HAS_APP_STORE_CONNECT_API_KEY == 'true' && env.HAS_APPLE_INSTALLER_CERTIFICATE == 'true'
        env:
          APP_STORE_CONNECT_ISSUER: ${{ secrets.APP_STORE_CONNECT_ISSUER }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          APP_STORE_CONNECT_APP_ID: ${{ secrets.APP_STORE_CONNECT_APP_ID_MAC }}
          APP_VERSION: ${{ needs.version-gate.outputs.version }}
          MAX_WAIT_MINUTES: "25"
        run: |
          # 写入 API Key 并设置路径供 Python 脚本使用
          mkdir -p ~/private_keys
          KEY_PATH="$HOME/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          echo "$APP_STORE_CONNECT_API_KEY" | base64 --decode > "$KEY_PATH"
          export APP_STORE_CONNECT_KEY_PATH="$KEY_PATH"

          # APP_VERSION 已由 version-gate 从 version.json 解析(无 v 前缀)，直接透传
          python3 scripts/submit-appstore-review.py MAC_OS

  ios:
    if: github.ref_name == 'appstore' || startsWith(github.ref, 'refs/tags/')
    needs: [version-gate]
    runs-on: macos-latest
    concurrency:
      group: ios-build-${{ github.ref }}
      cancel-in-progress: false
    environment:
      name: appstore
    env:
      HAS_IOS_APPLE_CERTIFICATE: ${{ secrets.IOS_APPLE_CERTIFICATE != '' }}
      # iOS 证书步骤允许回退到通用证书, 所以这里也要有对应标记, 否则 `if` 里的
      # `|| env.HAS_APPLE_CERTIFICATE == 'true'` 恒为空, 回退分支永远不成立。
      HAS_APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE != '' }}
      HAS_IOS_PROVISIONING_PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE != '' }}
      HAS_APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY != '' }}
      HAS_APP_STORE_CONNECT_APP_ID_IOS: ${{ secrets.APP_STORE_CONNECT_APP_ID_IOS != '' }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Fix Homebrew tap trust warnings (macOS runner image compat)
        run: |
          brew untap aws/tap 2>/dev/null || true
          brew tap --repair 2>/dev/null || true

      # ---- App Store 版本重复快速拦截 (在耗时构建之前失败) ----
      - name: Write App Store Connect API key
        if: env.HAS_APP_STORE_CONNECT_API_KEY == 'true'
        env:
          APP_STORE_CONNECT_ISSUER: ${{ secrets.APP_STORE_CONNECT_ISSUER }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          APP_STORE_CONNECT_APP_ID: ${{ secrets.APP_STORE_CONNECT_APP_ID_IOS }}
        run: |
          mkdir -p ~/private_keys
          echo "$APP_STORE_CONNECT_API_KEY" | base64 --decode > ~/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8
          echo "APP_STORE_CONNECT_KEY_PATH=$HOME/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8" >> $GITHUB_ENV

      - name: Fail fast if iOS App Store version already exists
        if: env.HAS_APP_STORE_CONNECT_API_KEY == 'true'
        env:
          APP_STORE_CONNECT_ISSUER: ${{ secrets.APP_STORE_CONNECT_ISSUER }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          APP_STORE_CONNECT_APP_ID: ${{ secrets.APP_STORE_CONNECT_APP_ID_IOS }}
          APP_VERSION: ${{ needs.version-gate.outputs.version }}
        run: python3 scripts/check-appstore-version.py IOS "$APP_VERSION"

      - name: Install Rust targets
        run: rustup target add aarch64-apple-ios aarch64-apple-ios-sim x86_64-apple-ios

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '20'

      - run: npm ci

      - name: Build dist/
        run: node scripts/build.js

      - name: Check for CDN references
        run: npm run check:cdn

      - name: Import Apple certificate (iOS)
        if: env.HAS_IOS_APPLE_CERTIFICATE == 'true' || env.HAS_APPLE_CERTIFICATE == 'true'
        env:
          IOS_APPLE_CERTIFICATE: ${{ secrets.IOS_APPLE_CERTIFICATE }}
          # 回退目标: 只配了通用 APPLE_CERTIFICATE 的 iOS job 也必须能签名,
          # 否则该步骤会被静默跳过, 构建走到 codesign 才以无签名错误收场。
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_KEYCHAIN_PASSWORD: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
        run: |
          # 优先使用 iOS 专用证书，否则回退到环境中的通用证书
          CERT_BASE64="${IOS_APPLE_CERTIFICATE:-$APPLE_CERTIFICATE}"
          echo "$CERT_BASE64" | base64 --decode > certificate.p12
          # 创建构建用 keychain
          security create-keychain -p "$APPLE_KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          security unlock-keychain -p "$APPLE_KEYCHAIN_PASSWORD" build.keychain
          # 导入证书到 build.keychain
          security import certificate.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$APPLE_KEYCHAIN_PASSWORD" build.keychain
          # 同时导入到 login.keychain（Xcode 默认会搜）
          security unlock-keychain -p "$APPLE_KEYCHAIN_PASSWORD" login.keychain 2>/dev/null || true
          security import certificate.p12 -k login.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security 2>/dev/null || true
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$APPLE_KEYCHAIN_PASSWORD" login.keychain 2>/dev/null || true
          # 设置 keychain 搜索路径
          security list-keychains -d user -s build.keychain login.keychain
          security default-keychain -s build.keychain
          # 验证并自动检测签名身份
          echo "=== All signing identities (all keychains) ==="
          security find-identity -v -p codesigning
          echo "=== Login keychain identities ==="
          security find-identity -v -p codesigning login.keychain 2>/dev/null || echo "(login.keychain not found)"
          echo "=== Build keychain identities ==="
          security find-identity -v -p codesigning build.keychain
          SIGNING_ID=$(security find-identity -v -p codesigning | grep -o '"[^"]*"' | head -1 | tr -d '"')
          echo "Detected signing identity: $SIGNING_ID"
          echo "APPLE_SIGNING_IDENTITY=$SIGNING_ID" >> $GITHUB_ENV
          # 输出证书完整信息（类型、颁发者、有效期）
          echo "=== Certificate full details ==="
          CERT_PEM=$(security find-certificate -a -p build.keychain)
          if [ -n "$CERT_PEM" ]; then
            echo "$CERT_PEM" | openssl x509 -noout -text 2>/dev/null | head -30
          else
            echo "(no cert found in build.keychain)"
          fi
          echo "=== Login keychain certs ==="
          CERT_PEM2=$(security find-certificate -a -p login.keychain 2>/dev/null)
          if [ -n "$CERT_PEM2" ]; then
            echo "$CERT_PEM2" | openssl x509 -noout -subject -issuer 2>/dev/null
          else
            echo "(no cert found in login.keychain)"
          fi

      - name: Install iOS provisioning profile
        if: env.HAS_IOS_PROVISIONING_PROFILE == 'true'
        env:
          IOS_PROVISIONING_PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE }}
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$IOS_PROVISIONING_PROFILE" | base64 --decode > ios-profile.mobileprovision
          # 提取 profile 的 UUID 和 Name
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c "Print UUID" /dev/stdin 2>/dev/null <<< $(security cms -D -i ios-profile.mobileprovision 2>/dev/null))
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c "Print Name" /dev/stdin 2>/dev/null <<< $(security cms -D -i ios-profile.mobileprovision 2>/dev/null))
          echo "Profile UUID: $PROFILE_UUID"
          echo "Profile Name: $PROFILE_NAME"
          # 用 UUID 命名保存
          cp ios-profile.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/${PROFILE_UUID}.mobileprovision
          echo "PROFILE_UUID=$PROFILE_UUID" >> $GITHUB_ENV
          echo "PROFILE_NAME=$PROFILE_NAME" >> $GITHUB_ENV

      - name: Initialize iOS project
        run: |
          npx tauri ios init --ci --config src-tauri/tauri.ios.conf.json
          # 权限声明来自 src-tauri/Info.ios.plist —— Tauri 会自动查找与 tauri.conf.json
          # 同目录的 Info.plist / Info.ios.plist（后者仅 iOS），并与模板 Info.plist 合并。
          # 踩过的两个坑：
          #   1) bundle.ios.infoPlist / bundle.iOS.infoPlist 写成键值字典 → schema 里
          #      infoPlist 是「文件路径字符串」，字典类型无效，v1.5.56/57 因此静默失效。
          #   2) 真正被 Xcode 编译的 plist 是 gen/apple/<app>_iOS/Info.plist，
          #      不是 gen/apple/Info.plist。v1.5.58 用 PlistBuddy 写到后者，日志打印
          #      "Parse Error: Unclosed Quotes / File Doesn't Exist, Will Create" 却仍 exit 0，
          #      权限声明进了一个没人读的幽灵文件 → Take Photo 依旧闪退。
          # 因此这里遍历真实 plist 校验，缺失才兜底注入；判定一律用 PlistBuddy Print 的
          # 退出码（解析失败也会 exit 0，绝不能只 grep 某个固定路径）。
          PLIST_COUNT=0
          while IFS= read -r -d '' PLIST; do
          PLIST_COUNT=$((PLIST_COUNT + 1))
          # tauri-bundler 把 productName 直写进 CFBundleDisplayName / CFBundleName
          # (ios.rs 直接取 settings.product_name())，而 Tauri schema 的 bundle.iOS
          # 没有任何名称字段（只有 MacConfig.bundleName），所以 iOS 侧只能在此改写。
          # 自品牌名改为 HushJSON(8 字符)后，productName 本身已不再超 Apple 标注的
          # iOS CFBundleName 15 字符上限（旧值 "Advanced JSON Formatter" 23 字符会被
          # 截断成 "Advanced JSON..."）；这里保留改写，作用是把两个键钉成确定值并
          # 逐 plist 复验，防止模板或 bundler 行为变化把展示名带偏。
          for KEY in CFBundleDisplayName CFBundleName; do
            /usr/libexec/PlistBuddy -c "Delete :$KEY" "$PLIST" 2>/dev/null || true
            /usr/libexec/PlistBuddy -c "Add :$KEY string HushJSON" "$PLIST"
            # 复验：PlistBuddy 解析失败也会 exit 0，只能靠 Print 的退出码判定
            if ! /usr/libexec/PlistBuddy -c "Print :$KEY" "$PLIST" >/dev/null 2>&1; then
              echo "::error::$PLIST 写入 $KEY 失败"
              exit 1
            fi
          done
          echo "OK: $PLIST 显示名已设为 HushJSON"
          if /usr/libexec/PlistBuddy -c "Print :NSCameraUsageDescription" "$PLIST" >/dev/null 2>&1; then
              echo "OK: $PLIST 已含 NSCameraUsageDescription"
              continue
            fi
            echo "WARN: $PLIST 缺失，执行兜底注入"
            /usr/libexec/PlistBuddy -c "Delete :NSCameraUsageDescription" "$PLIST" 2>/dev/null || true
            # 整段 -c 参数用双引号，值本身不再包引号（包了就是 v1.5.58 的未闭合引号事故）
            /usr/libexec/PlistBuddy -c "Add :NSCameraUsageDescription string Camera access is required to take a photo for the background image." "$PLIST"
            # 复验：Add 失败时 PlistBuddy 也可能 exit 0
            if ! /usr/libexec/PlistBuddy -c "Print :NSCameraUsageDescription" "$PLIST" >/dev/null 2>&1; then
              echo "::error::兜底注入后 $PLIST 仍无 NSCameraUsageDescription"
              exit 1
            fi
            echo "OK: $PLIST 兜底注入并复验通过"
          done < <(find src-tauri/gen/apple -maxdepth 2 -name Info.plist -not -path "*/build/*" -print0)
          if [ "$PLIST_COUNT" -eq 0 ]; then
            echo "::error::未找到 Xcode 工程的 Info.plist，无从校验权限声明"
            exit 1
          fi
          echo "校验完成：$PLIST_COUNT 个 Info.plist"

      # 必须在 ios init 之后跑：tauri icon 只有检测到
      # gen/apple/Assets.xcassets/AppIcon.appiconset 已存在才会把 iOS 图标
      # 写进 Xcode 资产目录，否则只回退写到 icons/ios/。
      # 而 ios init 用模板内嵌的默认 Tauri 图标填充 appiconset，
      # 先 icon 后 init = 上线默认图标（v1.5.52 及之前多轮图标修复无效的根因）。
      - name: Generate iOS icons (into Xcode asset catalog)
        run: |
          npx tauri icon src-tauri/app-icon-source.png
          npm run icons:generate
          # 用自研脚本的无 alpha 版本覆盖（2026 Apple 规范：RGB 不透明、全出血）
          cp src-tauri/icons/ios/AppIcon-*.png src-tauri/gen/apple/Assets.xcassets/AppIcon.appiconset/
          echo "=== appiconset contents ==="
          ls src-tauri/gen/apple/Assets.xcassets/AppIcon.appiconset/
          # 熔断：确保 appiconset 里是自定义图标而非 ios init 模板的默认 Tauri 图标。
          # 旧判据"体积>1MB"针对 v1.5.65 亚麻纹理旧图标；v1.5.67 起扁平新图标
          # 1024px 合法体积仅 ~78KB，会被误判（v1.5.70 构建因此误中止）。
          # 新判据：appiconset 必须与自研脚本产物逐字节一致（验证 cp 覆盖链路），
          # 且为 1024x1024、体积合理、无 alpha 通道（App Store 90717 拒收含
          # alpha 的图标，v1.5.71 因此上传失败）。
          S=src-tauri/gen/apple/Assets.xcassets/AppIcon.appiconset/AppIcon-512@2x.png
          SRC=src-tauri/icons/ios/AppIcon-512@2x.png
          SIZE=$(stat -f%z "$S")
          echo "AppIcon-512@2x.png size: $SIZE bytes"
          if [ "$SIZE" -lt 20000 ] || [ "$SIZE" -gt 5000000 ]; then
            echo "::error::AppIcon-512@2x.png 体积异常（$SIZE bytes），中止构建"
            exit 1
          fi
          DIMS=$(sips -g pixelWidth -g pixelHeight "$S" | awk '/pixel/{print $2}' | paste -sd x -)
          echo "AppIcon-512@2x.png dims: $DIMS"
          if [ "$DIMS" != "1024x1024" ]; then
            echo "::error::AppIcon-512@2x.png 尺寸为 ${DIMS:-未知}，应为 1024x1024，中止构建"
            exit 1
          fi
          HAS_ALPHA=$(sips -g hasAlpha "$S" 2>/dev/null | awk '/hasAlpha/{print $2}')
          echo "AppIcon-512@2x.png hasAlpha: ${HAS_ALPHA:-未知}"
          if [ "$HAS_ALPHA" = "yes" ]; then
            echo "::error::AppIcon-512@2x.png 含 alpha 通道，App Store 90717 拒收，中止构建"
            exit 1
          fi
          if ! cmp -s "$S" "$SRC"; then
            echo "::error::appiconset 与自研脚本产物不一致，图标覆盖链路断裂（疑似模板默认图标），中止构建"
            exit 1
          fi
          echo "OK: appiconset 与自研图标一致"

      - name: Configure iOS signing
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          PBXPROJ="src-tauri/gen/apple/advanced-json-formatter.xcodeproj/project.pbxproj"
          # 输出当前签名配置用于调试
          echo "=== Before ==="
          grep -E "(DEVELOPMENT_TEAM|CODE_SIGN_STYLE|PROVISIONING_PROFILE|CODE_SIGN_IDENTITY|PRODUCT_BUNDLE_IDENTIFIER)" "$PBXPROJ" | head -20

          # 用 Python 批量修改所有 buildSettings 块
          python3 << 'PYEOF'
          import re
          import os

          team_id = os.environ.get("APPLE_TEAM_ID", "")
          profile_name = os.environ.get("PROFILE_NAME", "")
          profile_uuid = os.environ.get("PROFILE_UUID", "")
          pbxproj_path = "src-tauri/gen/apple/advanced-json-formatter.xcodeproj/project.pbxproj"

          with open(pbxproj_path, "r") as f:
              content = f.read()

          # 找到所有 buildSettings = { ... } 块，在里面插入/替换签名配置
          def find_matching_brace(text, start):
              """找到与 start 处 { 匹配的 }; 位置"""
              depth = 1
              pos = start
              while depth > 0 and pos < len(text):
                  if text[pos] == '{':
                      depth += 1
                  elif text[pos] == '}':
                      depth -= 1
                  pos += 1
              if pos < len(text) and text[pos] == ';':
                  pos += 1
              return pos

          # 替换 buildSettings 块
          result = []
          i = 0
          prefix = 'buildSettings = {'
          while i < len(content):
              idx = content.find(prefix, i)
              if idx == -1:
                  result.append(content[i:])
                  break
              result.append(content[i:idx])
              end = find_matching_brace(content, idx + len(prefix))
              block = content[idx:end]

              # 修改 block 内的签名设置
              settings_to_add = {
                  "DEVELOPMENT_TEAM": f'"{team_id}"',
                  "CODE_SIGN_STYLE": "Manual",
                  "CODE_SIGN_IDENTITY": '"iPhone Distribution"',
                  # 2027 春起 altool 硬性要求 MinimumOSVersion ≥ 15.0（iOS 27
                  # 时代 iOS 14 占比可忽略），Tauri 模板默认 14.0 会在上传时报警
                  "IPHONEOS_DEPLOYMENT_TARGET": '"15.0"',
              }
              if profile_name:
                  settings_to_add["PROVISIONING_PROFILE_SPECIFIER"] = f'"{profile_name}"'
              if profile_uuid:
                  settings_to_add["PROVISIONING_PROFILE"] = f'"{profile_uuid}"'

              for key, value in settings_to_add.items():
                  # 如果已存在则替换
                  p = re.compile(rf'(\t*){key}\s*=\s*[^;]+;')
                  if p.search(block):
                      block = p.sub(rf'\1{key} = {value};', block)
                  else:
                      # 在 buildSettings = { 后面插入
                      block = block.replace(
                          "buildSettings = {",
                          f"buildSettings = {{\n\t\t\t\t{key} = {value};",
                          1
                      )
              result.append(block)
              i = end

          content = ''.join(result)

          with open(pbxproj_path, "w") as f:
              f.write(content)

          print("Done")
          PYEOF

          echo ""
          echo "=== After ==="
          grep -E "(DEVELOPMENT_TEAM|CODE_SIGN_STYLE|PROVISIONING_PROFILE|CODE_SIGN_IDENTITY|PRODUCT_BUNDLE_IDENTIFIER)" "$PBXPROJ" | head -30

          # 验证最低部署版本写入成功（altool 901/90068 警告的根治）
          if grep -q 'IPHONEOS_DEPLOYMENT_TARGET = "15.0"' "$PBXPROJ"; then
            echo "OK: IPHONEOS_DEPLOYMENT_TARGET = 15.0"
          else
            echo "::error::IPHONEOS_DEPLOYMENT_TARGET 未写入 15.0，MinimumOSVersion 仍是模板默认，中止构建"
            exit 1
          fi

      # iPhone Duo（2026-10-23 上市，出厂 iOS 27.1）的完全兼容模式（全屏利用
      # 折叠屏区域）需用 iOS 27.1 SDK 构建——Apple 三档兼容机制的顶档，
      # iOS 26 SDK 构建的应用只有默认安全区模式。GitHub 镜像提供 Xcode 27.1
      # 后自动启用；未提供时保持镜像默认，构建不受影响。
      - name: Select Xcode 27.1 if available (iPhone Duo full-compat SDK)
        run: |
          if [ -d "/Applications/Xcode_27.1.app" ]; then
            sudo xcode-select -s /Applications/Xcode_27.1.app
            echo "已切换到 Xcode 27.1"
          else
            echo "镜像暂无 Xcode 27.1，使用默认 Xcode"
          fi
          xcodebuild -version

      - name: Create export options plist
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          mkdir -p src-tauri/gen/apple/export
          cat > src-tauri/gen/apple/export/exportOptions.plist << PLISTEOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store</string>
              <key>teamID</key>
              <string>${APPLE_TEAM_ID}</string>
              <key>provisioningProfiles</key>
              <dict>
                  <key>com.jsonbeautify.desktop.appstore.ios</key>
                  <string>${PROFILE_NAME}</string>
              </dict>
              <key>signingStyle</key>
              <string>manual</string>
              <key>signingCertificate</key>
              <string>iPhone Distribution</string>
          </dict>
          </plist>
          PLISTEOF
          echo "=== exportOptions.plist ==="
          cat src-tauri/gen/apple/export/exportOptions.plist

      - name: Build iOS archive
        run: |
          npx tauri ios build \
            --target aarch64 \
            --config src-tauri/tauri.ios.conf.json \
            --ci \
            --archive-only
          # 熔断：校验真正要上架的产物（archive 内 .app 的 Info.plist），
          # 而不是仓库里某个 plist 源文件 —— v1.5.58 就是因为校验了没人读的
          # gen/apple/Info.plist 才一路假绿灯到 TestFlight，装机后 Take Photo 崩溃。
          ARCHIVE=$(find src-tauri/gen/apple/build -name "*.xcarchive" -type d | head -1)
          if [ -z "$ARCHIVE" ]; then
            echo "::error::未找到 xcarchive，无法校验权限声明"
            exit 1
          fi
          APP_PLIST=$(find "$ARCHIVE/Products/Applications" -maxdepth 2 -name Info.plist | head -1)
          echo "Archive app Info.plist: $APP_PLIST"
          if [ -z "$APP_PLIST" ]; then
            echo "::error::archive 内未找到 .app/Info.plist"
            exit 1
          fi
          if ! /usr/libexec/PlistBuddy -c "Print :NSCameraUsageDescription" "$APP_PLIST"; then
            echo "::error::归档产物缺少 NSCameraUsageDescription，Take Photo 必崩，中止上传"
            exit 1
          fi
          # 同样在最终产物上校验显示名：init 阶段的改写若没被 Xcode 真正编进
          # archive，仍会一路绿灯到 TestFlight，图标标签显示成被截断的完整名。
          ARCHIVED_NAME=$(/usr/libexec/PlistBuddy -c "Print :CFBundleDisplayName" "$APP_PLIST" 2>/dev/null || true)
          echo "归档产物 CFBundleDisplayName: $ARCHIVED_NAME"
          if [ "$ARCHIVED_NAME" != "HushJSON" ]; then
            echo "::error::归档产物 CFBundleDisplayName='$ARCHIVED_NAME'，期望 'HushJSON'，桌面图标标签会与品牌不一致"
            exit 1
          fi

      - name: Export IPA
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          ARCHIVE=$(find src-tauri/gen/apple/build -name "*.xcarchive" -type d | head -1)
          echo "Archive: $ARCHIVE"
          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE" \
            -exportPath src-tauri/gen/apple/build \
            -exportOptionsPlist src-tauri/gen/apple/export/exportOptions.plist \
            -allowProvisioningUpdates

          echo "=== Generated IPA ==="
          find src-tauri/gen/apple/build -name "*.ipa" -type f 2>/dev/null

      - name: Upload IPA to App Store Connect
        if: env.HAS_APP_STORE_CONNECT_API_KEY == 'true' && env.HAS_APP_STORE_CONNECT_APP_ID_IOS == 'true'
        env:
          APP_STORE_CONNECT_ISSUER: ${{ secrets.APP_STORE_CONNECT_ISSUER }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
        run: |
          # 写入 API Key
          mkdir -p ~/private_keys
          echo "$APP_STORE_CONNECT_API_KEY" | base64 --decode > ~/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8

          IPA=$(find src-tauri/gen/apple/build -name "*.ipa" -type f | head -1)
          if [ -z "$IPA" ]; then
            echo "ERROR: No IPA found"
            exit 1
          fi
          echo "Uploading IPA: $IPA"

          xcrun altool --upload-app \
            -f "$IPA" \
            --type ios \
            --apiKey "$APP_STORE_CONNECT_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER" \
            --verbose

          echo "✓ IPA uploaded to App Store Connect"

      - name: Install cryptography (pinned)
        if: env.HAS_APP_STORE_CONNECT_API_KEY == 'true' && env.HAS_APP_STORE_CONNECT_APP_ID_IOS == 'true'
        run: |
          # venv 而非系统 pip: 新版 runner 的 Python 可能带 EXTERNALLY-MANAGED 标记(PEP 668),
          # 直接 pip install 会失败。venv 同时避免污染 runner 自带环境。
          python3 -m venv "$RUNNER_TEMP/appstore-venv"
          echo "$RUNNER_TEMP/appstore-venv/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/appstore-venv/bin/python" -m pip install --upgrade pip -q
          "$RUNNER_TEMP/appstore-venv/bin/python" -m pip install "cryptography==50.0.1" -q

      - name: Submit for review
        if: env.HAS_APP_STORE_CONNECT_API_KEY == 'true' && env.HAS_APP_STORE_CONNECT_APP_ID_IOS == 'true'
        env:
          APP_STORE_CONNECT_ISSUER: ${{ secrets.APP_STORE_CONNECT_ISSUER }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          APP_STORE_CONNECT_APP_ID: ${{ secrets.APP_STORE_CONNECT_APP_ID_IOS }}
          APP_VERSION: ${{ needs.version-gate.outputs.version }}
          # Apple 摄取延迟常见 30+ 分钟, 25 不够 (1.5.58 即因此超时)
          MAX_WAIT_MINUTES: "40"
        run: |
          # 写入 API Key 并设置路径供 Python 脚本使用
          mkdir -p ~/private_keys
          KEY_PATH="$HOME/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          echo "$APP_STORE_CONNECT_API_KEY" | base64 --decode > "$KEY_PATH"
          export APP_STORE_CONNECT_KEY_PATH="$KEY_PATH"

          # APP_VERSION 已由 version-gate 从 version.json 解析(无 v 前缀)，直接透传
          python3 scripts/submit-appstore-review.py IOS
