[package]
name = "hush-json"
version = "1.5.82"
description = "HushJSON: JSON Formatter - 支持格式化、压缩、树形视图、对比和历史记录"
authors = ["sky-jiangcheng"]
license = "MIT"
repository = "https://github.com/sky-jiangcheng/hush-json"
edition = "2021"

[lib]
crate-type = ["staticlib", "cdylib", "lib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# 仅在 Rust 侧调用的插件。capabilities/default.json 不授予任何 dialog:* /
# clipboard-manager:* 权限, 因此 WebView 内的脚本无法触达它们的 JS API,
# CVE-2026-95627 (dialog 选择器递归扩权) 因此没有攻击者可达的触发路径。
# 刻意不引入 tauri-plugin-fs: 它是 fs 写作用域的来源, 本项目用 std::fs 即可。
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
